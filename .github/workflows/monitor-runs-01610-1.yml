name: AVA 01610 — Read-only Workflow Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: ava-01610-read-only-monitor
  cancel-in-progress: true

permissions:
  actions: read
  issues: write

jobs:
  monitor:
    name: Summarize recent workflow runs (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 10 \
            --json databaseId,workflowName,event,status,conclusion,createdAt,url \
            > runs.json
          cat runs.json
          {
            echo "## AVA 01610 — read-only workflow monitor"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Observed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Latest ten workflow runs; no issue comments or repository writes."
            echo
            echo "Latest ten workflow runs (JSON):"
            cat runs.json
          } >> "$GITHUB_STEP_SUMMARY"
