name: AVA 01610-1 — Inspect Workflow Runs

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run ID to inspect
        required: true
        type: string
      ava_run_id:
        description: AVA workflow run ID to inspect
        required: true
        type: string

permissions:
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect requested workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          AVA_RUN_ID: ${{ inputs.ava_run_id }}
        run: |
          set -euo pipefail

          inspect_run() {
            local label="$1"
            local run_id="$2"

            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::The $label run ID must be a positive integer."
              return 1
            fi

            local response
            response=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")

            echo "$label run:"
            jq -e --arg run_id "$run_id" '
              if (.id | tostring) == $run_id
              then {id, status, conclusion, head_sha}
              else error("API response did not match requested run ID")
              end
            ' <<< "$response"
          }

          inspect_run "CI" "$CI_RUN_ID"
          inspect_run "AVA" "$AVA_RUN_ID"
