name: AVA 01610-1 — Monitor Runs Every 5 Minutes

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions scheduled workflows support a minimum interval of five minutes.
    - cron: '*/5 * * * *'

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    name: Read-only status snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch the two configured workflow run statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs"
          SUMMARY="${GITHUB_STEP_SUMMARY}"

          echo "# AVA 01610-1 — Workflow status snapshot" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "Checked at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          while IFS='|' read -r name run_id; do
            [[ -n "$run_id" ]] || continue

            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/${run_id}")"

            status="$(jq -r '.status // "unknown"' <<< "$response")"
            conclusion="$(jq -r '.conclusion // "pending"' <<< "$response")"
            sha="$(jq -r '.head_sha // "unknown"' <<< "$response")"
            url="$(jq -r '.html_url // ""' <<< "$response")"
            created="$(jq -r '.created_at // "unknown"' <<< "$response")"

            {
              echo "## ${name} — run ${run_id}"
              echo "- Status: \`${status}\`"
              echo "- Conclusion: \`${conclusion}\`"
              echo "- Head SHA: \`${sha}\`"
              echo "- Created at: \`${created}\`"
              if [[ -n "$url" ]]; then
                echo "- Run: ${url}"
              fi
              echo ""
            } >> "$SUMMARY"
          done <<'RUNS'
          CI|37096869178
          AVA - Run Everywhere|37096865813
          RUNS
