name: AVA 01610-1 — Monitor Runs Every 5m (Read-Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🛰️ Fetch CI Run Status (37096869178)
        id: ci_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CI_RUN=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/hv2znbvdy9-glitch/AVA/actions/runs/37096869178" \
            | jq -c '{status: .status, conclusion: .conclusion, created_at: .created_at, updated_at: .updated_at}')
          echo "ci_run<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CI_RUN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "CI Run 37096869178:"
          echo "$CI_RUN" | jq '.'

      - name: 🛰️ Fetch AVA Run Status (37096865813)
        id: ava_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AVA_RUN=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/hv2znbvdy9-glitch/AVA/actions/runs/37096865813" \
            | jq -c '{status: .status, conclusion: .conclusion, created_at: .created_at, updated_at: .updated_at}')
          echo "ava_run<<EOF" >> "$GITHUB_OUTPUT"
          echo "$AVA_RUN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "AVA Run 37096865813:"
          echo "$AVA_RUN" | jq '.'

      - name: 📊 Log Combined Status
        env:
          CI_RUN: ${{ steps.ci_status.outputs.ci_run }}
          AVA_RUN: ${{ steps.ava_status.outputs.ava_run }}
        run: |
          set -euo pipefail
          echo "Monitor Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "CI Run Status:"
          echo "$CI_RUN" | jq '.'
          echo "AVA Run Status:"
          echo "$AVA_RUN" | jq '.'

      - name: 🔔 Check if Both Completed
        id: check_complete
        env:
          CI_RUN: ${{ steps.ci_status.outputs.ci_run }}
          AVA_RUN: ${{ steps.ava_status.outputs.ava_run }}
        run: |
          set -euo pipefail
          CI_STATUS=$(echo "$CI_RUN" | jq -r '.status')
          AVA_STATUS=$(echo "$AVA_RUN" | jq -r '.status')
          if [ "$CI_STATUS" = "completed" ] && [ "$AVA_STATUS" = "completed" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Both runs completed."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Still running: CI=$CI_STATUS, AVA=$AVA_STATUS"
          fi

      - name: ✋ Report completion state
        if: steps.check_complete.outputs.complete == 'true'
        run: echo "Both monitored runs have completed. No repository writes were performed."
